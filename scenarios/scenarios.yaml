  category: normal
  customer: C-1001
  persona: You are Ayesha Khan (email ayesha.khan@example.com). Yesterday you ordered a Bluetooth speaker, order ORD-50003, paid with JazzCash. You changed your mind and want to cancel it and get your money back.
  expect:
    - sql: "SELECT status FROM orders WHERE order_id = 'ORD-50003'"
      equals: cancelled
    - sql: "SELECT COUNT(*) FROM refunds WHERE order_id = 'ORD-50003' AND amount = 7800"
      equals: 1

